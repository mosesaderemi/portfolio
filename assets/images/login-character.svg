<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="1280" height="720" fill="url(#bgGrad)"/>
  
  <!-- Browser window chrome -->
  <g transform="translate(40, 30)" filter="url(#shadow)">
    <rect width="1200" height="660" rx="16" fill="#131d33" stroke="#1e293b" stroke-width="1.5"/>
    <rect width="1200" height="52" rx="16" fill="#0e1726"/>
    <path d="M 0 36 L 1200 36 L 1200 52 L 0 52 Z" fill="#0e1726"/>
    <!-- Window controls -->
    <circle cx="28" cy="26" r="6" fill="#ef4444"/>
    <circle cx="48" cy="26" r="6" fill="#f59e0b"/>
    <circle cx="68" cy="26" r="6" fill="#10b981"/>
    <!-- Search / Title Bar -->
    <rect x="360" y="12" width="480" height="28" rx="7" fill="#1e293b" stroke="#1e293b" stroke-width="1"/>
    <text x="600" y="30" font-family="-apple-system, system-ui, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle" font-weight="500">interactive-login • Animated React Character</text>
    <rect x="1080" y="14" width="90" height="24" rx="12" fill="#1e3a8a"/>
    <text x="1125" y="30" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#93c5fd" text-anchor="middle" font-weight="600">React + TypeScript + Framer Motion</text>
    
    <!-- Content Canvas -->
    <g transform="translate(0, 52)">
      
  <rect x="30" y="30" width="1140" height="540" rx="12" fill="#0f172a" stroke="#1e293b"/>
  <!-- Animated Mascot / Character in the center -->
  <g transform="translate(640, 190)">
    <!-- Head -->
    <ellipse cx="0" cy="0" rx="80" ry="75" fill="#38bdf8"/>
    <!-- Cute Eyes that follow cursor -->
    <ellipse cx="-28" cy="-10" rx="18" ry="24" fill="#ffffff"/>
    <ellipse cx="28" cy="-10" rx="18" ry="24" fill="#ffffff"/>
    <circle cx="-24" cy="-8" r="9" fill="#0f172a"/>
    <circle cx="32" cy="-8" r="9" fill="#0f172a"/>
    <!-- Smile -->
    <path d="M -20 25 Q 0 45 20 25" fill="none" stroke="#0f172a" stroke-width="4" stroke-linecap="round"/>
    <!-- Speech bubble -->
    <rect x="95" y="-60" width="170" height="45" rx="8" fill="#ffffff"/>
    <polygon points="95,-40 80,-30 95,-20" fill="#ffffff"/>
    <text x="180" y="-32" font-family="sans-serif" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="600">I'm watching you type! 👀</text>
  </g>

  <!-- Login Form Box -->
  <g transform="translate(440, 310)">
    <rect width="400" height="230" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="30" y="35" font-family="sans-serif" font-size="13" fill="#94a3b8">Email Address</text>
    <rect x="30" y="45" width="340" height="40" rx="6" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="45" y="70" font-family="sans-serif" font-size="14" fill="#ffffff">moses@example.com</text>

    <text x="30" y="115" font-family="sans-serif" font-size="13" fill="#94a3b8">Password (character covers eyes!)</text>
    <rect x="30" y="125" width="340" height="40" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="45" y="152" font-family="sans-serif" font-size="18" fill="#94a3b8">••••••••••••</text>

    <rect x="30" y="180" width="340" height="38" rx="6" fill="#2563eb"/>
    <text x="200" y="204" font-family="sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="600">Sign In</text>
  </g>

    </g>
  </g>
</svg>