<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="1280" height="720" fill="url(#bgGrad)"/>
  
  <!-- Browser window chrome -->
  <g transform="translate(40, 30)" filter="url(#shadow)">
    <rect width="1200" height="660" rx="16" fill="#131d33" stroke="#1e293b" stroke-width="1.5"/>
    <rect width="1200" height="52" rx="16" fill="#0e1726"/>
    <path d="M 0 36 L 1200 36 L 1200 52 L 0 52 Z" fill="#0e1726"/>
    <!-- Window controls -->
    <circle cx="28" cy="26" r="6" fill="#ef4444"/>
    <circle cx="48" cy="26" r="6" fill="#f59e0b"/>
    <circle cx="68" cy="26" r="6" fill="#10b981"/>
    <!-- Search / Title Bar -->
    <rect x="360" y="12" width="480" height="28" rx="7" fill="#1e293b" stroke="#1e293b" stroke-width="1"/>
    <text x="600" y="30" font-family="-apple-system, system-ui, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle" font-weight="500">langgraph-orchestrator • Personal AI Assistant</text>
    <rect x="1080" y="14" width="90" height="24" rx="12" fill="#1e3a8a"/>
    <text x="1125" y="30" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#93c5fd" text-anchor="middle" font-weight="600">Python + LangGraph</text>
    
    <!-- Content Canvas -->
    <g transform="translate(0, 52)">
      
  <rect x="30" y="30" width="1140" height="540" rx="12" fill="#0b1120" stroke="#1e293b"/>
  <text x="60" y="70" font-family="sans-serif" font-size="20" fill="#ffffff" font-weight="700">LangGraph Multi-Agent Orchestration Graph</text>
  <text x="60" y="95" font-family="sans-serif" font-size="13" fill="#94a3b8">Autonomous task delegation across Google Calendar, Notion, Gmail, and Slack</text>
  
  <!-- Agent Nodes in a DAG -->
  <!-- Supervisor Node -->
  <g transform="translate(100, 240)">
    <rect width="180" height="85" rx="10" fill="#1e3a8a" stroke="#3b82f6" stroke-width="2"/>
    <text x="90" y="38" font-family="sans-serif" font-size="14" fill="#ffffff" font-weight="700" text-anchor="middle">Supervisor Agent</text>
    <text x="90" y="60" font-family="sans-serif" font-size="11" fill="#93c5fd" text-anchor="middle">Intent Router</text>
  </g>

  <!-- Connectors -->
  <line x1="280" y1="282" x2="420" y2="160" stroke="#3b82f6" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="280" y1="282" x2="420" y2="282" stroke="#3b82f6" stroke-width="2"/>
  <line x1="280" y1="282" x2="420" y2="400" stroke="#3b82f6" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- Calendar Agent -->
  <g transform="translate(420, 115)">
    <rect width="200" height="85" rx="10" fill="#131d33" stroke="#10b981" stroke-width="2"/>
    <text x="100" y="38" font-family="sans-serif" font-size="14" fill="#ffffff" font-weight="700" text-anchor="middle">Calendar &amp; Booking</text>
    <text x="100" y="60" font-family="sans-serif" font-size="11" fill="#6ee7b7" text-anchor="middle">Google Workspace API</text>
  </g>

  <!-- Notion Task Agent -->
  <g transform="translate(420, 240)">
    <rect width="200" height="85" rx="10" fill="#131d33" stroke="#f59e0b" stroke-width="2"/>
    <text x="100" y="38" font-family="sans-serif" font-size="14" fill="#ffffff" font-weight="700" text-anchor="middle">Notion Task Manager</text>
    <text x="100" y="60" font-family="sans-serif" font-size="11" fill="#fde68a" text-anchor="middle">Database Sync Active</text>
  </g>

  <!-- Web Research Agent -->
  <g transform="translate(420, 365)">
    <rect width="200" height="85" rx="10" fill="#131d33" stroke="#a855f7" stroke-width="2"/>
    <text x="100" y="38" font-family="sans-serif" font-size="14" fill="#ffffff" font-weight="700" text-anchor="middle">Web Research Agent</text>
    <text x="100" y="60" font-family="sans-serif" font-size="11" fill="#d8b4fe" text-anchor="middle">Tavily / Perplexity API</text>
  </g>

  <!-- Execution Console Output on Right -->
  <g transform="translate(680, 115)">
    <rect width="450" height="335" rx="10" fill="#050811" stroke="#1e293b"/>
    <rect width="450" height="32" rx="10" fill="#0f172a"/>
    <text x="20" y="22" font-family="monospace" font-size="12" fill="#94a3b8">Execution Log • telegram_webhook: active</text>
    
    <g transform="translate(20, 50)" font-family="monospace" font-size="11" fill="#e2e8f0">
      <text y="20" fill="#38bdf8">&gt; User prompt: "Reschedule client sync to 4pm &amp; update Notion"</text>
      <text y="42" fill="#94a3b8">[2026-10-05 10:14:02] Routing to [Calendar, Notion]</text>
      <text y="64" fill="#10b981">✓ Google Calendar: Moved "Sprint Check-in" -&gt; 16:00 UTC</text>
      <text y="86" fill="#10b981">✓ Notion API: Updated property "Status" -&gt; In Progress</text>
      <text y="108" fill="#38bdf8">&gt; Notification dispatched to Slack #general</text>
      <text y="130" fill="#a855f7">★ State preserved in LangGraph SQLite Checkpointer</text>
    </g>
  </g>

    </g>
  </g>
</svg>