    <text x="414" y="369" class="txt-dark" font-size="11" font-weight="700" text-anchor="middle">SJ</text>
    <text x="438" y="368" class="txt-dark" font-size="13" font-weight="600">Sarah Jenkins</text>
    <text x="580" y="368" class="txt-muted" font-size="13">Ward B • Room 302</text>
    <text x="730" y="368" class="txt-dark" font-size="13" font-weight="600">72 bpm</text>
    <text x="840" y="368" class="txt-dark" font-size="13" font-weight="600">98%</text>
    <rect x="940" y="352" width="76" height="22" class="badge-green" rx="11" />
    <text x="978" y="367" class="txt-green" font-size="11" font-weight="600" text-anchor="middle">● Stable</text>
    <text x="1060" y="368" class="txt-accent" font-size="12" font-weight="600">View Chart →</text>

    <!-- Table Row 2 -->
    <line x1="273" y1="466" x2="1175" y2="466" class="divider" />
    <text x="294" y="436" class="txt-accent" font-size="13" font-weight="600">PAT-8043</text>
    <circle cx="414" cy="432" r="14" fill="#dbeafe" />
    <text x="414" y="437" fill="#1d4ed8" font-size="11" font-weight="700" text-anchor="middle">DC</text>
    <text x="438" y="436" class="txt-dark" font-size="13" font-weight="600">David Chen</text>
    <text x="580" y="436" class="txt-muted" font-size="13">Ward A • Room 108</text>
    <text x="730" y="436" class="txt-dark" font-size="13" font-weight="600">84 bpm</text>
    <text x="840" y="436" class="txt-dark" font-size="13" font-weight="600">96%</text>
    <rect x="940" y="420" width="76" height="22" class="badge-green" rx="11" />
    <text x="978" y="435" class="txt-green" font-size="11" font-weight="600" text-anchor="middle">● Stable</text>
    <text x="1060" y="436" class="txt-accent" font-size="12" font-weight="600">View Chart →</text>

    <!-- Table Row 3 -->
    <line x1="273" y1="534" x2="1175" y2="534" class="divider" />
    <text x="294" y="504" class="txt-accent" font-size="13" font-weight="600">PAT-8044</text>
    <circle cx="414" cy="500" r="14" fill="#fae8ff" />
    <text x="414" y="505" fill="#86198f" font-size="11" font-weight="700" text-anchor="middle">ER</text>
    <text x="438" y="504" class="txt-dark" font-size="13" font-weight="600">Elena Rostova</text>
    <text x="580" y="504" class="txt-muted" font-size="13">ICU • Bed 04</text>
    <text x="730" y="504" class="txt-dark" font-size="13" font-weight="600">68 bpm</text>
    <text x="840" y="504" class="txt-dark" font-size="13" font-weight="600">99%</text>
    <rect x="940" y="488" width="94" height="22" class="badge-blue" rx="11" />
    <text x="987" y="503" class="txt-blue" font-size="11" font-weight="600" text-anchor="middle">● Monitoring</text>
    <text x="1060" y="504" class="txt-accent" font-size="12" font-weight="600">View Chart →</text>

    <!-- Table Row 4 -->
    <line x1="273" y1="602" x2="1175" y2="602" class="divider" />
    <text x="294" y="572" class="txt-accent" font-size="13" font-weight="600">PAT-8045</text>
    <circle cx="414" cy="568" r="14" class="avatar-bg" />
    <text x="414" y="573" class="txt-dark" font-size="11" font-weight="700" text-anchor="middle">MV</text>
    <text x="438" y="572" class="txt-dark" font-size="13" font-weight="600">Marcus Vance</text>
    <text x="580" y="572" class="txt-muted" font-size="13">Ward C • Room 214</text>
    <text x="730" y="572" class="txt-dark" font-size="13" font-weight="600">76 bpm</text>
    <text x="840" y="572" class="txt-dark" font-size="13" font-weight="600">97%</text>
    <rect x="940" y="556" width="76" height="22" class="badge-green" rx="11" />
    <text x="978" y="571" class="txt-green" font-size="11" font-weight="600" text-anchor="middle">● Stable</text>
    <text x="1060" y="572" class="txt-accent" font-size="12" font-weight="600">View Chart →</text>

    <!-- Table Row 5 -->
    <text x="294" y="640" class="txt-accent" font-size="13" font-weight="600">PAT-8046</text>
    <circle cx="414" cy="636" r="14" fill="#fef3c7" />
    <text x="414" y="641" fill="#92400e" font-size="11" font-weight="700" text-anchor="middle">AO</text>
    <text x="438" y="640" class="txt-dark" font-size="13" font-weight="600">Amara Okafor</text>
    <text x="580" y="640" class="txt-muted" font-size="13">Ward B • Room 310</text>
    <text x="730" y="640" class="txt-dark" font-size="13" font-weight="600">70 bpm</text>
    <text x="840" y="640" class="txt-dark" font-size="13" font-weight="600">98%</text>
    <rect x="940" y="624" width="76" height="22" class="badge-green" rx="11" />
    <text x="978" y="639" class="txt-green" font-size="11" font-weight="600" text-anchor="middle">● Stable</text>
    <text x="1060" y="640" class="txt-accent" font-size="12" font-weight="600">View Chart →</text>
