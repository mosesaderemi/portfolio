  <!-- BOTTOM MICROSERVICES TELEMETRY FOOTER BAR -->
  <g filter="url(#shadow)">
    <rect x="272" y="692" width="904" height="84" class="card" />
    <text x="294" y="718" class="txt-dark" font-size="11" font-weight="700" letter-spacing="0.8">SPRING CLOUD DISTRIBUTED SERVICES TELEMETRY</text>

    <circle cx="300" cy="748" r="5" fill="#10b981" />
    <text x="312" y="752" class="txt-dark" font-size="12" font-weight="600">Auth Service</text>
    <text x="388" y="752" class="txt-muted" font-size="11">Spring Security 6 (12ms)</text>

    <circle cx="528" cy="748" r="5" fill="#10b981" />
    <text x="540" y="752" class="txt-dark" font-size="12" font-weight="600">Patient Service</text>
    <text x="632" y="752" class="txt-muted" font-size="11">PostgreSQL Vitals (8ms)</text>

    <circle cx="764" cy="748" r="5" fill="#10b981" />
    <text x="776" y="752" class="txt-dark" font-size="12" font-weight="600">Scheduling Service</text>
    <text x="888" y="752" class="txt-muted" font-size="11">Optimistic Lock (14ms)</text>

    <circle cx="986" cy="748" r="5" fill="#10b981" />
    <text x="998" y="752" class="txt-dark" font-size="12" font-weight="600">Billing Service</text>
    <text x="1084" y="752" class="txt-muted" font-size="11">Stripe &amp; Jasper (18ms)</text>
  </g>

</svg>
