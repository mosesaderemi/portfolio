    <text x="840" y="317" class="txt-muted" font-size="11" font-weight="700" letter-spacing="0.8">SpO2</text>
    <text x="940" y="317" class="txt-muted" font-size="11" font-weight="700" letter-spacing="0.8">STATUS</text>
    <text x="1060" y="317" class="txt-muted" font-size="11" font-weight="700" letter-spacing="0.8">ACTION</text>

    <!-- Table Row 1 -->
    <line x1="273" y1="398" x2="1175" y2="398" class="divider" />
    <text x="294" y="368" class="txt-accent" font-size="13" font-weight="600">PAT-8042</text>
