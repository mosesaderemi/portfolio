<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
      .bg { fill: #f8fafc; }
      .sidebar { fill: #0f172a; }
      .card { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1; rx: 12px; }
      .hdr { fill: #020617; }
      .txt-white { fill: #ffffff; }
      .txt-dark { fill: #0f172a; }
      .txt-muted { fill: #64748b; }
      .txt-accent { fill: #1d4ed8; }
      .badge-green { fill: #f0fdf4; stroke: #bbf7d0; stroke-width: 1; }
      .txt-green { fill: #15803d; }
      .badge-blue { fill: #eff6ff; stroke: #bfdbfe; stroke-width: 1; }
      .txt-blue { fill: #1d4ed8; }
      .table-hdr { fill: #f1f5f9; }
      .nav-active { fill: #1d4ed8; rx: 8px; }
      .divider { stroke: #f1f5f9; stroke-width: 1; }
      .avatar-bg { fill: #e2e8f0; }
      .tab-active { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1; rx: 6px; }
    </style>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.04" />
    </filter>
  </defs>

  <!-- Browser Frame Base -->
  <rect width="1200" height="800" class="bg" rx="16" />
  
  <!-- Browser Top Bar -->
  <rect width="1200" height="44" class="hdr" rx="16" />
  <rect y="30" width="1200" height="14" class="hdr" />
  
  <!-- Window Control Buttons -->
  <circle cx="24" cy="22" r="6" fill="#ef4444" />
  <circle cx="44" cy="22" r="6" fill="#f59e0b" />
  <circle cx="64" cy="22" r="6" fill="#10b981" />
  
  <!-- Address Bar -->
  <rect x="100" y="10" width="440" height="24" fill="#1e293b" rx="6" />
  <text x="116" y="26" fill="#94a3b8" font-size="12" font-weight="400">https://healthos.app/clinical/telemetry</text>

  <!-- System Status Pill -->
  <rect x="940" y="11" width="236" height="22" fill="rgba(255,255,255,0.08)" rx="11" />
  <circle cx="956" cy="22" r="4" fill="#10b981" />
  <text x="968" y="26" fill="#e2e8f0" font-size="11" font-weight="500">Spring Gateway • 5 Services Online</text>

  <!-- LEFT SIDEBAR -->
  <rect x="0" y="44" width="240" height="756" class="sidebar" />
  
  <!-- Logo / Brand -->
  <rect x="24" y="70" width="34" height="34" fill="#1d4ed8" rx="8" />
  <path d="M41 78 v18 M32 87 h18" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
  <text x="68" y="86" class="txt-white" font-size="17" font-weight="700">HealthOS</text>
  <text x="68" y="99" fill="#64748b" font-size="10" font-weight="600" letter-spacing="1.2">CLINICAL OPERATING SYSTEM</text>

  <!-- Sidebar Search -->
  <rect x="16" y="120" width="208" height="32" fill="#1e293b" rx="6" />
  <text x="28" y="141" fill="#64748b" font-size="12">🔍 Quick Search... ⌘K</text>

  <!-- Nav Section 1 -->
  <text x="24" y="178" fill="#475569" font-size="10" font-weight="700" letter-spacing="1.2">CLINICAL MODULES</text>

  <!-- Active Item: Dashboard -->
  <rect x="16" y="190" width="208" height="36" class="nav-active" />
  <text x="36" y="213" class="txt-white" font-size="13" font-weight="600">Clinical Telemetry</text>

  <!-- Nav Items -->
  <text x="36" y="253" fill="#94a3b8" font-size="13" font-weight="500">Patient Records</text>
  <rect x="180" y="241" width="34" height="18" fill="#1e293b" rx="9" />
  <text x="197" y="254" fill="#94a3b8" font-size="10" font-weight="600" text-anchor="middle">1.2k</text>

  <text x="36" y="293" fill="#94a3b8" font-size="13" font-weight="500">Appointments &amp; Triage</text>
  <rect x="192" y="281" width="22" height="18" fill="#1e293b" rx="9" />
  <text x="203" y="294" fill="#38bdf8" font-size="10" font-weight="600" text-anchor="middle">32</text>

  <text x="36" y="333" fill="#94a3b8" font-size="13" font-weight="500">Doctor Schedules</text>
  
  <text x="24" y="378" fill="#475569" font-size="10" font-weight="700" letter-spacing="1.2">ADMIN &amp; FINANCIAL</text>
  <text x="36" y="403" fill="#94a3b8" font-size="13" font-weight="500">Billing &amp; Invoices</text>
  <text x="36" y="443" fill="#94a3b8" font-size="13" font-weight="500">Spring Gateway Nodes</text>

  <!-- Sidebar User Footer -->
  <line x1="24" y1="724" x2="216" y2="724" stroke="#1e293b" stroke-width="1" />
  <circle cx="42" cy="754" r="16" fill="#1d4ed8" />
  <text x="42" y="759" class="txt-white" font-size="12" font-weight="700" text-anchor="middle">AM</text>
  <text x="68" y="752" class="txt-white" font-size="13" font-weight="600">Dr. Aderemi Moses</text>
  <text x="68" y="766" fill="#64748b" font-size="11">Chief Systems Architect</text>

  <!-- MAIN CONTENT AREA -->
  <!-- Top Bar -->
  <text x="272" y="86" class="txt-dark" font-size="22" font-weight="700">Patient Telemetry &amp; Clinical Operations</text>
  <text x="272" y="106" class="txt-muted" font-size="13">Real-time PostgreSQL vitals stream • Spring Cloud API Gateway</text>

  <!-- Top Action Buttons -->
  <rect x="944" y="70" width="108" height="34" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" rx="8" />
  <text x="998" y="92" class="txt-dark" font-size="12" font-weight="600" text-anchor="middle">Export Report</text>

  <rect x="1062" y="70" width="114" height="34" fill="#1d4ed8" rx="8" />
  <text x="1119" y="92" class="txt-white" font-size="12" font-weight="600" text-anchor="middle">+ New Admission</text>

  <!-- 3 METRIC CARDS -->
  <!-- Card 1 -->
  <g filter="url(#shadow)">
    <rect x="272" y="130" width="284" height="92" class="card" />
    <text x="294" y="156" class="txt-muted" font-size="11" font-weight="700" letter-spacing="0.5">TOTAL ACTIVE PATIENTS</text>
    <text x="294" y="196" class="txt-dark" font-size="28" font-weight="700">1,248</text>
    <rect x="468" y="174" width="68" height="22" class="badge-green" rx="11" />
    <text x="502" y="189" class="txt-green" font-size="11" font-weight="600" text-anchor="middle">+4.2% wk</text>
  </g>

  <!-- Card 2 -->
  <g filter="url(#shadow)">
    <rect x="574" y="130" width="284" height="92" class="card" />
    <text x="596" y="156" class="txt-muted" font-size="11" font-weight="700" letter-spacing="0.5">TELEMETRY STREAM</text>
