<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="1280" height="720" fill="url(#bgGrad)"/>
  
  <!-- Browser window chrome -->
  <g transform="translate(40, 30)" filter="url(#shadow)">
    <rect width="1200" height="660" rx="16" fill="#131d33" stroke="#1e293b" stroke-width="1.5"/>
    <rect width="1200" height="52" rx="16" fill="#0e1726"/>
    <path d="M 0 36 L 1200 36 L 1200 52 L 0 52 Z" fill="#0e1726"/>
    <!-- Window controls -->
    <circle cx="28" cy="26" r="6" fill="#ef4444"/>
    <circle cx="48" cy="26" r="6" fill="#f59e0b"/>
    <circle cx="68" cy="26" r="6" fill="#10b981"/>
    <!-- Search / Title Bar -->
    <rect x="360" y="12" width="480" height="28" rx="7" fill="#1e293b" stroke="#1e293b" stroke-width="1"/>
    <text x="600" y="30" font-family="-apple-system, system-ui, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle" font-weight="500">ev-pricing-model.py • Electric Car Market Valuation</text>
    <rect x="1080" y="14" width="90" height="24" rx="12" fill="#1e3a8a"/>
    <text x="1125" y="30" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#93c5fd" text-anchor="middle" font-weight="600">Python + Scikit-Learn</text>
    
    <!-- Content Canvas -->
    <g transform="translate(0, 52)">
      
  <!-- Left Side: Sliders and Inputs -->
  <rect x="30" y="30" width="460" height="540" rx="12" fill="#0f172a" stroke="#1e293b"/>
  <text x="60" y="70" font-family="sans-serif" font-size="18" fill="#ffffff" font-weight="700">Vehicle Specifications</text>
  
  <g transform="translate(60, 110)">
    <text x="0" y="0" font-family="sans-serif" font-size="13" fill="#94a3b8">Battery Capacity (kWh)</text>
    <text x="340" y="0" font-family="sans-serif" font-size="13" fill="#38bdf8" font-weight="600">82.5 kWh</text>
    <rect x="0" y="12" width="340" height="8" rx="4" fill="#1e293b"/>
    <rect x="0" y="12" width="250" height="8" rx="4" fill="#38bdf8"/>
    <circle cx="250" cy="16" r="8" fill="#ffffff"/>
  </g>

  <g transform="translate(60, 185)">
    <text x="0" y="0" font-family="sans-serif" font-size="13" fill="#94a3b8">Range / Efficiency (WLTP km)</text>
    <text x="340" y="0" font-family="sans-serif" font-size="13" fill="#38bdf8" font-weight="600">540 km</text>
    <rect x="0" y="12" width="340" height="8" rx="4" fill="#1e293b"/>
    <rect x="0" y="12" width="280" height="8" rx="4" fill="#38bdf8"/>
    <circle cx="280" cy="16" r="8" fill="#ffffff"/>
  </g>

  <g transform="translate(60, 260)">
    <text x="0" y="0" font-family="sans-serif" font-size="13" fill="#94a3b8">Top Speed (km/h)</text>
    <text x="340" y="0" font-family="sans-serif" font-size="13" fill="#38bdf8" font-weight="600">225 km/h</text>
    <rect x="0" y="12" width="340" height="8" rx="4" fill="#1e293b"/>
    <rect x="0" y="12" width="220" height="8" rx="4" fill="#38bdf8"/>
    <circle cx="220" cy="16" r="8" fill="#ffffff"/>
  </g>

  <g transform="translate(60, 335)">
    <text x="0" y="0" font-family="sans-serif" font-size="13" fill="#94a3b8">Fastcharge Speed (km/h)</text>
    <text x="340" y="0" font-family="sans-serif" font-size="13" fill="#38bdf8" font-weight="600">650 km/h</text>
    <rect x="0" y="12" width="340" height="8" rx="4" fill="#1e293b"/>
    <rect x="0" y="12" width="270" height="8" rx="4" fill="#38bdf8"/>
    <circle cx="270" cy="16" r="8" fill="#ffffff"/>
  </g>

  <rect x="60" y="440" width="340" height="48" rx="10" fill="#2563eb"/>
  <text x="230" y="470" font-family="sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="700">Compute Valuation Model</text>

  <!-- Right Side: Regression Curve and Predicted Price -->
  <g transform="translate(520, 30)">
    <!-- Predicted Price Card -->
    <rect width="640" height="150" rx="12" fill="#0f172a" stroke="#1e293b"/>
    <text x="40" y="50" font-family="sans-serif" font-size="14" fill="#94a3b8" font-weight="600">ESTIMATED MARKET VALUATION</text>
    <text x="40" y="105" font-family="sans-serif" font-size="44" fill="#10b981" font-weight="800">$54,820 USD</text>
    <text x="360" y="102" font-family="sans-serif" font-size="15" fill="#94a3b8">R² Score: <tspan fill="#ffffff" font-weight="600">0.914</tspan> · RMSE: <tspan fill="#ffffff" font-weight="600">±$2.4k</tspan></text>

    <!-- Regression Chart -->
    <g transform="translate(0, 180)">
      <rect width="640" height="360" rx="12" fill="#0f172a" stroke="#1e293b"/>
      <text x="40" y="40" font-family="sans-serif" font-size="15" fill="#ffffff" font-weight="600">Battery Capacity vs. Predicted Price Curve</text>
      <!-- Grid lines -->
      <line x1="60" y1="280" x2="580" y2="280" stroke="#1e293b" stroke-width="1"/>
      <line x1="60" y1="210" x2="580" y2="210" stroke="#1e293b" stroke-width="1"/>
      <line x1="60" y1="140" x2="580" y2="140" stroke="#1e293b" stroke-width="1"/>
      <line x1="60" y1="70" x2="580" y2="70" stroke="#1e293b" stroke-width="1"/>
      <!-- Regression curve path -->
      <path d="M 60 270 Q 240 230 360 150 T 580 80" fill="none" stroke="#3b82f6" stroke-width="3.5"/>
      <!-- Scatter dots -->
      <circle cx="100" cy="260" r="5" fill="#60a5fa" opacity="0.75"/><circle cx="140" cy="245" r="5" fill="#60a5fa" opacity="0.75"/><circle cx="180" cy="240" r="5" fill="#60a5fa" opacity="0.75"/><circle cx="220" cy="215" r="5" fill="#60a5fa" opacity="0.75"/><circle cx="270" cy="195" r="5" fill="#60a5fa" opacity="0.75"/><circle cx="310" cy="180" r="5" fill="#60a5fa" opacity="0.75"/><circle cx="370" cy="140" r="5" fill="#60a5fa" opacity="0.75"/><circle cx="420" cy="130" r="5" fill="#60a5fa" opacity="0.75"/><circle cx="480" cy="105" r="5" fill="#60a5fa" opacity="0.75"/><circle cx="530" cy="90" r="5" fill="#60a5fa" opacity="0.75"/>
      <!-- Current predicted point -->
      <circle cx="440" cy="120" r="9" fill="#10b981" stroke="#ffffff" stroke-width="2"/>
    </g>
  </g>

    </g>
  </g>
</svg>