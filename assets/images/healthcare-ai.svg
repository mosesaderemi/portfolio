<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="1280" height="720" fill="url(#bgGrad)"/>
  
  <!-- Browser window chrome -->
  <g transform="translate(40, 30)" filter="url(#shadow)">
    <rect width="1200" height="660" rx="16" fill="#131d33" stroke="#1e293b" stroke-width="1.5"/>
    <rect width="1200" height="52" rx="16" fill="#0e1726"/>
    <path d="M 0 36 L 1200 36 L 1200 52 L 0 52 Z" fill="#0e1726"/>
    <!-- Window controls -->
    <circle cx="28" cy="26" r="6" fill="#ef4444"/>
    <circle cx="48" cy="26" r="6" fill="#f59e0b"/>
    <circle cx="68" cy="26" r="6" fill="#10b981"/>
    <!-- Search / Title Bar -->
    <rect x="360" y="12" width="480" height="28" rx="7" fill="#1e293b" stroke="#1e293b" stroke-width="1"/>
    <text x="600" y="30" font-family="-apple-system, system-ui, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle" font-weight="500">healthcare-ai.app • Diagnostic AI Web App</text>
    <rect x="1080" y="14" width="90" height="24" rx="12" fill="#1e3a8a"/>
    <text x="1125" y="30" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#93c5fd" text-anchor="middle" font-weight="600">Flask + TensorFlow</text>
    
    <!-- Content Canvas -->
    <g transform="translate(0, 52)">
      
  <!-- Left Side: Radiograph / Diagnostic Scan -->
  <rect x="30" y="30" width="480" height="540" rx="12" fill="#050811" stroke="#1e293b"/>
  <!-- Simulated Chest X-Ray with heatmap -->
  <ellipse cx="270" cy="280" rx="170" ry="210" fill="#0f172a" opacity="0.8"/>
  <path d="M 210 140 Q 270 200 210 380 Q 150 260 210 140 Z" fill="#1e293b" opacity="0.6"/>
  <path d="M 330 140 Q 270 200 330 380 Q 390 260 330 140 Z" fill="#1e293b" opacity="0.6"/>
  <!-- Heatmap hotspot -->
  <circle cx="230" cy="300" r="65" fill="#f43f5e" opacity="0.35" filter="blur(10px)"/>
  <circle cx="230" cy="300" r="35" fill="#fbbf24" opacity="0.5" filter="blur(6px)"/>
  <text x="50" y="65" font-family="sans-serif" font-size="15" fill="#94a3b8" font-weight="600">INPUT: CHEST RADIOGRAPH CXR-0892</text>
  <rect x="50" y="520" width="130" height="28" rx="6" fill="#1e293b"/>
  <text x="115" y="538" font-family="sans-serif" font-size="12" fill="#38bdf8" text-anchor="middle">Grad-CAM Active</text>

  <!-- Right Side: 6 Disease Classification Probability Gauges -->
  <g transform="translate(540, 30)">
    <text x="0" y="24" font-family="sans-serif" font-size="20" fill="#f8fafc" font-weight="700">TensorFlow Deep Learning Screening</text>
    <text x="0" y="48" font-family="sans-serif" font-size="13" fill="#94a3b8">Multi-label classification across 6 diagnostic risk factors</text>
    
    <!-- Item 1 -->
    <g transform="translate(0, 80)">
      <text x="0" y="16" font-family="sans-serif" font-size="14" fill="#f8fafc" font-weight="600">Pneumonia</text>
      <text x="590" y="16" font-family="sans-serif" font-size="14" fill="#f43f5e" font-weight="700" text-anchor="end">94.8% High Risk</text>
      <rect x="0" y="28" width="600" height="12" rx="6" fill="#1e293b"/>
      <rect x="0" y="28" width="568" height="12" rx="6" fill="#f43f5e"/>
    </g>
    <!-- Item 2 -->
    <g transform="translate(0, 150)">
      <text x="0" y="16" font-family="sans-serif" font-size="14" fill="#f8fafc" font-weight="600">Cardiomegaly</text>
      <text x="590" y="16" font-family="sans-serif" font-size="14" fill="#38bdf8" font-weight="700" text-anchor="end">12.4% Normal</text>
      <rect x="0" y="28" width="600" height="12" rx="6" fill="#1e293b"/>
      <rect x="0" y="28" width="74" height="12" rx="6" fill="#38bdf8"/>
    </g>
    <!-- Item 3 -->
    <g transform="translate(0, 220)">
      <text x="0" y="16" font-family="sans-serif" font-size="14" fill="#f8fafc" font-weight="600">Pleural Effusion</text>
      <text x="590" y="16" font-family="sans-serif" font-size="14" fill="#fbbf24" font-weight="700" text-anchor="end">68.2% Moderate</text>
      <rect x="0" y="28" width="600" height="12" rx="6" fill="#1e293b"/>
      <rect x="0" y="28" width="409" height="12" rx="6" fill="#fbbf24"/>
    </g>
    <!-- Item 4 -->
    <g transform="translate(0, 290)">
      <text x="0" y="16" font-family="sans-serif" font-size="14" fill="#f8fafc" font-weight="600">Infiltration</text>
      <text x="590" y="16" font-family="sans-serif" font-size="14" fill="#fbbf24" font-weight="700" text-anchor="end">54.1% Moderate</text>
      <rect x="0" y="28" width="600" height="12" rx="6" fill="#1e293b"/>
      <rect x="0" y="28" width="324" height="12" rx="6" fill="#fbbf24"/>
    </g>
    <!-- Item 5 -->
    <g transform="translate(0, 360)">
      <text x="0" y="16" font-family="sans-serif" font-size="14" fill="#f8fafc" font-weight="600">Atelectasis</text>
      <text x="590" y="16" font-family="sans-serif" font-size="14" fill="#38bdf8" font-weight="700" text-anchor="end">8.9% Normal</text>
      <rect x="0" y="28" width="600" height="12" rx="6" fill="#1e293b"/>
      <rect x="0" y="28" width="53" height="12" rx="6" fill="#38bdf8"/>
    </g>
    <!-- Item 6 -->
    <g transform="translate(0, 430)">
      <text x="0" y="16" font-family="sans-serif" font-size="14" fill="#f8fafc" font-weight="600">Pneumothorax</text>
      <text x="590" y="16" font-family="sans-serif" font-size="14" fill="#38bdf8" font-weight="700" text-anchor="end">3.1% Normal</text>
      <rect x="0" y="28" width="600" height="12" rx="6" fill="#1e293b"/>
      <rect x="0" y="28" width="18" height="12" rx="6" fill="#38bdf8"/>
    </g>
  </g>

    </g>
  </g>
</svg>